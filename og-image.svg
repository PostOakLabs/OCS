    <circle cx="1031" cy="178" r="0.6"/>
    <circle cx="1087" cy="61"  r="0.5"/>
    <circle cx="1142" cy="142" r="0.55"/>
    <circle cx="1168" cy="338" r="0.6"/>
    <circle cx="58"   cy="402" r="0.5"/>
    <circle cx="117"  cy="471" r="0.6"/>
    <circle cx="175"  cy="368" r="0.55"/>
    <circle cx="232"  cy="503" r="0.7"/>
    <circle cx="289"  cy="427" r="0.5"/>
    <circle cx="358"  cy="551" r="0.6"/>
    <circle cx="412"  cy="492" r="0.55"/>
    <circle cx="476"  cy="568" r="0.7"/>
    <circle cx="538"  cy="436" r="0.5"/>
    <circle cx="601"  cy="521" r="0.6"/>
    <circle cx="671"  cy="468" r="0.55"/>
    <circle cx="729"  cy="591" r="0.7"/>
    <circle cx="792"  cy="492" r="0.5"/>
    <circle cx="853"  cy="543" r="0.6"/>
    <circle cx="918"  cy="478" r="0.55"/>
    <circle cx="978"  cy="567" r="0.7"/>
    <circle cx="1038" cy="441" r="0.5"/>
    <circle cx="1094" cy="513" r="0.6"/>
    <circle cx="1152" cy="476" r="0.55"/>
  </g>

  <!-- A few brighter stars -->
  <g fill="#ffc840" opacity="0.9">
    <circle cx="232"  cy="143" r="1.2"/>
    <circle cx="688"  cy="62"  r="1.3"/>
    <circle cx="1031" cy="291" r="1.1"/>
    <circle cx="98"   cy="278" r="1.0"/>
    <circle cx="412"  cy="389" r="1.2"/>
  </g>

  <g fill="#4de8c0" opacity="0.85">
    <circle cx="376" cy="241" r="1.0"/>
    <circle cx="912" cy="318" r="1.1"/>
    <circle cx="62"  cy="514" r="0.9"/>
  </g>

  <!-- Cluster: outer glow halo, then dense core. Positioned at right side, vertical center. -->
  <g transform="translate(960, 320)" filter="url(#softglow)">
    <!-- Outer faint halo -->
    <circle r="240" fill="url(#cluster)"/>
  </g>

  <!-- ISCO ring suggestion around cluster center -->
  <circle cx="960" cy="320" r="170" fill="url(#isco)" opacity="0.6"/>

  <!-- Dense cluster stars (manual scatter for the 'cluster' feel) -->
  <g fill="#fff5d0" transform="translate(960, 320)">
    <!-- Core: dense, bright -->
    <circle cx="0"  cy="0"  r="2.5"/>
    <circle cx="3"  cy="-2" r="1.7"/>
    <circle cx="-2" cy="3"  r="1.8"/>
    <circle cx="5"  cy="4"  r="1.5"/>
    <circle cx="-4" cy="-3" r="1.6"/>
    <circle cx="8"  cy="-1" r="1.3"/>
    <circle cx="-7" cy="2"  r="1.4"/>
    <circle cx="-1" cy="-8" r="1.3"/>
    <circle cx="3"  cy="9"  r="1.4"/>
    <circle cx="-9" cy="-7" r="1.1"/>
    <circle cx="11" cy="6"  r="1.2"/>
    <circle cx="6"  cy="-9" r="1.1"/>
    <!-- Mid -->
    <circle cx="-14" cy="3"   r="0.9"/>
