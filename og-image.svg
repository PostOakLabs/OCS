    <circle cx="-30" cy="14"  r="0.85"/>
    <circle cx="18"  cy="-24" r="0.85"/>
    <circle cx="-22" cy="-21" r="0.85"/>
    <circle cx="33"  cy="-9"  r="0.7"/>
    <circle cx="-34" cy="-9"  r="0.75"/>
    <circle cx="27"  cy="22"  r="0.75"/>
    <!-- Outer halo speckle -->
    <circle cx="42"  cy="-16" r="0.6"/>
    <circle cx="-45" cy="3"   r="0.6"/>
    <circle cx="38"  cy="28"  r="0.55"/>
    <circle cx="-38" cy="-32" r="0.55"/>
    <circle cx="-51" cy="22"  r="0.5"/>
    <circle cx="54"  cy="12"  r="0.55"/>
    <circle cx="-58" cy="-14" r="0.5"/>
    <circle cx="49"  cy="-32" r="0.5"/>
    <circle cx="11"  cy="-46" r="0.55"/>
    <circle cx="-13" cy="48"  r="0.55"/>
    <circle cx="63"  cy="-2"  r="0.5"/>
    <circle cx="-66" cy="9"   r="0.5"/>
    <circle cx="68"  cy="25"  r="0.45"/>
    <circle cx="-71" cy="-22" r="0.45"/>
    <circle cx="-29" cy="-58" r="0.5"/>
    <circle cx="32"  cy="58"  r="0.5"/>
    <circle cx="78"  cy="-18" r="0.4"/>
    <circle cx="-80" cy="-1"  r="0.4"/>
    <circle cx="22"  cy="-72" r="0.45"/>
    <circle cx="-19" cy="73"  r="0.45"/>
    <circle cx="86"  cy="11"  r="0.4"/>
    <circle cx="-88" cy="18"  r="0.4"/>
    <circle cx="91"  cy="-30" r="0.35"/>
    <circle cx="-95" cy="-26" r="0.35"/>
    <circle cx="-41" cy="-83" r="0.4"/>
    <circle cx="48"  cy="84"  r="0.4"/>
    <circle cx="100" cy="32"  r="0.35"/>
    <circle cx="-104" cy="13" r="0.35"/>
    <circle cx="14"  cy="-103" r="0.35"/>
    <circle cx="-11" cy="106"  r="0.35"/>
    <circle cx="110" cy="-9"   r="0.3"/>
    <circle cx="-113" cy="-37" r="0.3"/>
    <circle cx="-65" cy="-92"  r="0.3"/>
    <circle cx="70"  cy="98"   r="0.3"/>
  </g>

  <!-- Subtle Omega ring around the cluster (signature touch) -->
  <g transform="translate(960, 320)" fill="none" stroke="#a080f0" stroke-opacity="0.20" stroke-width="1">
    <circle r="200"/>
  </g>
  <g transform="translate(960, 320)" fill="none" stroke="#4de8c0" stroke-opacity="0.15" stroke-width="1">
    <circle r="155" stroke-dasharray="3 6"/>
  </g>

  <!-- Title text -->
  <g font-family="'Orbitron', 'Inter', system-ui, sans-serif" filter="url(#textglow)">
    <text x="80" y="265"
          font-size="62" font-weight="900"
          fill="url(#titleGrad)"
          letter-spacing="2">THE OMEGA</text>
    <text x="80" y="335"
          font-size="62" font-weight="900"
          fill="url(#titleGrad)"
          letter-spacing="2">CENTAURI SOCIETY</text>
  </g>

  <!-- Tagline -->
  <text x="80" y="395"
        font-family="'Crimson Pro', Georgia, serif"
        font-size="26"
        font-style="italic"
        fill="url(#subGrad)"
        letter-spacing="1">Toward the Innermost Stable Orbit</text>

  <!-- Bottom URL strip -->
  <g font-family="'Space Mono', ui-monospace, monospace">
    <text x="80" y="540" font-size="16" fill="#9890c0" letter-spacing="3">NGC 5139 · IMBH · FERMI PARADOX · MACRO TRANSCENSION</text>
    <text x="80" y="580" font-size="18" fill="#4de8c0" letter-spacing="2">omegacentauri.me</text>
  </g>

  <!-- Decorative top-left mark -->
  <g transform="translate(75, 95)">
    <circle r="14" fill="none" stroke="#a080f0" stroke-width="1.5"/>
    <circle r="4" fill="#4de8c0"/>
    <text x="34" y="6" font-family="'Space Mono', monospace" font-size="13" fill="#9890c0" letter-spacing="2">◉ OCS</text>
  </g>
</svg>
