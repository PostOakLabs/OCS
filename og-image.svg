<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 628" width="1200" height="628" role="img" aria-label="The Omega Centauri Society — Toward the Innermost Stable Orbit. omegacentauri.me">
  <title>The Omega Centauri Society — Toward the Innermost Stable Orbit</title>

  <defs>
    <!-- Deep space gradient: void → nebula → deep -->
    <radialGradient id="space" cx="58%" cy="48%" r="80%">
      <stop offset="0%"  stop-color="#1a1040" stop-opacity="1"/>
      <stop offset="35%" stop-color="#0d0a24" stop-opacity="1"/>
      <stop offset="100%" stop-color="#03020a" stop-opacity="1"/>
    </radialGradient>

    <!-- Cluster glow -->
    <radialGradient id="cluster" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#ffe8a0" stop-opacity="0.95"/>
      <stop offset="20%" stop-color="#f0a020" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#7055d4" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#7055d4" stop-opacity="0"/>
    </radialGradient>

    <!-- ISCO / accretion ring -->
    <radialGradient id="isco" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="80%" stop-color="#4de8c0" stop-opacity="0.45"/>
      <stop offset="92%" stop-color="#1dba90" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1dba90" stop-opacity="0"/>
    </radialGradient>

    <!-- Title gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#e8e4ff"/>
      <stop offset="55%" stop-color="#a080f0"/>
      <stop offset="100%" stop-color="#4de8c0"/>
    </linearGradient>

    <!-- Subtitle gradient -->
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#9890c0"/>
      <stop offset="100%" stop-color="#ffc840"/>
    </linearGradient>

    <filter id="softglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <filter id="textglow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="628" fill="url(#space)"/>

  <!-- Starfield (deterministic positions, three brightness tiers) -->
  <g fill="#e8e4ff" opacity="0.85">
    <circle cx="42"   cy="71"  r="0.7"/>
    <circle cx="95"   cy="118" r="0.6"/>
    <circle cx="148"  cy="44"  r="0.5"/>
    <circle cx="203"  cy="218" r="0.7"/>
    <circle cx="267"  cy="92"  r="0.55"/>
    <circle cx="331"  cy="167" r="0.6"/>
    <circle cx="389"  cy="49"  r="0.5"/>
    <circle cx="431"  cy="312" r="0.7"/>
    <circle cx="498"  cy="138" r="0.55"/>
    <circle cx="571"  cy="261" r="0.6"/>
    <circle cx="612"  cy="73"  r="0.5"/>
    <circle cx="688"  cy="403" r="0.7"/>
    <circle cx="743"  cy="121" r="0.55"/>
