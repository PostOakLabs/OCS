# ─────────────────────────────────────────────────────────────────────────────
# Deploy – The Omega Centauri Society → DreamHost shared hosting (rsync/SSH)
#
# Triggers
#   • Push to main  → full deploy
#   • workflow_dispatch → choose dry_run: true for a rehearsal with no live push
#
# Required repository secrets (Settings → Secrets → Actions):
#   DH_SSH_KEY    ed25519 private key (matching the public key in ~/.ssh/authorized_keys
#                 on DreamHost for the deploy user)
#   DH_SSH_USER   DreamHost shell username (e.g. ocsdeploy)
#   DH_SSH_HOST   DreamHost server hostname (e.g. example.dreamhost.com)
#   DH_WEB_ROOT   Absolute path to web root on DreamHost (e.g. /home/ocsdeploy/omegacentauri.me)
#   DH_SITE_URL   Canonical site URL for smoke test (e.g. https://omegacentauri.me)
#
# PREREQUISITE: The DreamHost user must have "Shell" access, not "SFTP only".
#   Verify in the DreamHost panel under Manage Users → Edit user → Shell account.
#   SFTP-only accounts accept SSH handshakes but silently drop commands, which
#   causes rsync to hang indefinitely.
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy to DreamHost

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run only — rehearse rsync without pushing live"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

# Cancel any in-flight deploy for the same branch so pushes don't pile up.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────────────────
# Job 1 – Validate
# Lightweight pre-flight: confirm every file the workflow will push exists
# and is readable, and that no obviously broken includes are present.
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify key HTML files are present
        run: |
          REQUIRED=(
            index.html
            faq.html
            membership.html
            proposals.html
            tools/index.html
            robots.txt
            sitemap.xml
            llms.txt
          )
          MISSING=0
          for f in "${REQUIRED[@]}"; do
            if [ ! -f "$f" ]; then
              echo "❌ Missing expected file: $f"
              MISSING=$((MISSING + 1))
            else
              echo "✅ $f"
            fi
          done
          if [ "$MISSING" -gt 0 ]; then
            echo ""
            echo "Validation failed: $MISSING required file(s) not found."
            exit 1
          fi

      - name: Count tool files
        run: |
          COUNT=$(find tools -maxdepth 1 -name "*.html" | wc -l)
          echo "Tool HTML files found: $COUNT"
          if [ "$COUNT" -lt 20 ]; then
            echo "❌ Expected at least 20 tool files; found $COUNT. Something may be missing."
            exit 1
          fi

      # Count-drift gate: fails if any published count sentinel is stale vs the
      # filesystem/manifest SSOT. Fix locally with: python3 scripts/verify-counts.py --fix
      - name: Count-drift gate
        run: python3 scripts/verify-counts.py

      # Broken-asset gate (strict-zero): fails if any href/src points at a missing
      # local file/dir. Catches the ../data/ 404 class of bug before it deploys.
      - name: Broken-link gate
        run: python3 scripts/check-links.py

      # Stranded-page gate (strict-zero): the mirror of the broken-link gate —
      # fails if a page exists that nothing links to, or if a tools/*.html
      # calculator is missing from the tools/index.html registry.
      - name: Stranded-page gate
        run: python3 scripts/check-orphans.py

      # OpenChainGraph gates (OCG 0.2→0.8 Phase B): inline-script syntax check,
      # forbidden-hash-scheme lint on all artifact-qualified tools, and a
      # frozen-envelope schema validation against a captured live fixture.
      - name: OpenChainGraph hash + schema gates
        run: |
          node scripts/syntax-check.mjs
          node scripts/lint-forbidden-hash.mjs
          node scripts/schema-validate.mjs

      # OCS-TEST-COVERAGE-SPEC.md v1 §5 — hash round-trip + known-value
      # regression gate. The first behavioral gate: everything above this
      # checks shape/count/digest, this checks a given input produces the
      # documented correct output.
      - name: Test — hash-param round-trip + known-value regression
        run: node --test scripts/tests/tier-c-*.test.mjs

      # imbh-constraints core library (OCS-JOSS-LIB-SPEC.md). Covers the
      # constraint schema, the window/tension aggregation and the hashed
      # output payload, and replays the RFC3161 + OTS anchored golden
      # (tools/data/anchored-evidence.json) so a refactor can never silently
      # move published output. The ocs-mcp-worker preflight runs the matching
      # parity gate against its §18-proven kernel.
      - name: Test — imbh-constraints library
        run: node --test scripts/tests/lib-imbh-constraints.test.mjs

  # ───────────────────────────────────────────────────────────────────────────
  # Job 2 – Deploy
  # Steps (in order):
  #   1. Checkout
  #   2. Verify secrets
  #   3. Install SSH key
  #   4. Test SSH connectivity
  #   5. rsync dry run (always — shows what would change)
  #   6. rsync live deploy (skipped when dry_run == 'true')
  #   7. Smoke test (skipped when dry_run == 'true')
  #   8. Deploy summary
  # ───────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── 1. Verify secrets ──────────────────────────────────────────────────
      - name: Verify required secrets are present
        env:
          DH_SSH_KEY:  ${{ secrets.DH_SSH_KEY }}
          DH_SSH_USER: ${{ secrets.DH_SSH_USER }}
          DH_SSH_HOST: ${{ secrets.DH_SSH_HOST }}
          DH_WEB_ROOT: ${{ secrets.DH_WEB_ROOT }}
          DH_SITE_URL: ${{ secrets.DH_SITE_URL }}
        run: |
          set -euo pipefail
          missing=()
          [ -z "${DH_SSH_KEY:-}"  ] && missing+=(DH_SSH_KEY)
          [ -z "${DH_SSH_USER:-}" ] && missing+=(DH_SSH_USER)
          [ -z "${DH_SSH_HOST:-}" ] && missing+=(DH_SSH_HOST)
          [ -z "${DH_WEB_ROOT:-}" ] && missing+=(DH_WEB_ROOT)
          [ -z "${DH_SITE_URL:-}" ] && missing+=(DH_SITE_URL)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}"
            echo "::error::Go to Settings → Secrets and variables → Actions and add the missing secrets."
            exit 1
          fi
          echo "All required secrets are present."

      # ── 2. Install SSH key ─────────────────────────────────────────────────
      - name: Install SSH key
        env:
          DH_SSH_KEY:  ${{ secrets.DH_SSH_KEY }}
          DH_SSH_HOST: ${{ secrets.DH_SSH_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          # tr -d '\r' strips Windows CRLF that corrupts PEM keys pasted from Windows
          echo "$DH_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DH_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          # Verify key was written correctly (safe — does not expose key content)
          echo "Key header : $(head -1 ~/.ssh/deploy_key)"
          echo "Key footer : $(tail -1 ~/.ssh/deploy_key)"
          echo "Permissions: $(stat -c %a ~/.ssh/deploy_key)"

      # ── 3. Test SSH connectivity ───────────────────────────────────────────
      - name: Test SSH connectivity
        env:
          DH_SSH_USER: ${{ secrets.DH_SSH_USER }}
          DH_SSH_HOST: ${{ secrets.DH_SSH_HOST }}
        run: |
          set -euo pipefail
          echo "Testing SSH connection to ${DH_SSH_HOST}…"
          for attempt in 1 2 3; do
            echo "Attempt ${attempt}/3…"
            if ssh -i ~/.ssh/deploy_key \
                   -o IdentitiesOnly=yes \
                   -o StrictHostKeyChecking=no \
                   -o ConnectTimeout=30 \
                   -o ServerAliveInterval=30 \
                   -o ServerAliveCountMax=3 \
                   "${DH_SSH_USER}@${DH_SSH_HOST}" "echo 'SSH OK'"; then
              echo "SSH connection successful."
              break
            fi
            if [ "${attempt}" -lt 3 ]; then
              echo "Connection failed, retrying in 15s…"
              sleep 15
            else
              echo "::error::SSH connection to ${DH_SSH_HOST}:22 timed out after 3 attempts."
              echo "::error::Check that (1) DH_SSH_HOST is the DreamHost server hostname (not your domain),"
              echo "::error::(2) the user has Shell access (not SFTP-only) in the DreamHost panel,"
              echo "::error::(3) DH_SSH_KEY matches the public key in ~/.ssh/authorized_keys on the server."
              exit 1
            fi
          done

      # ── 4. rsync dry run (always) ──────────────────────────────────────────
      - name: rsync dry run
        env:
          DH_SSH_USER: ${{ secrets.DH_SSH_USER }}
          DH_SSH_HOST: ${{ secrets.DH_SSH_HOST }}
          DH_WEB_ROOT: ${{ secrets.DH_WEB_ROOT }}
        run: |
          set -euo pipefail
          echo "=== DRY RUN — no files will be transferred ==="
          rsync -avz --omit-dir-times --dry-run \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.well-known/acme-challenge/' \
            --exclude='.dh-diag' \
            --exclude='CLAUDE.md' \
            --exclude='.DS_Store' \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o ConnectTimeout=30" \
            ./ "${DH_SSH_USER}@${DH_SSH_HOST}:${DH_WEB_ROOT}/"

      # ── 4b. WOULD-DELETE AUDIT (dry run, never writes) ────────────────────
      # Vendored from AINumbers/repo/.github/workflows/deploy-to-dreamhost.yml,
      # which has run --delete against the same DreamHost host class for months.
      #
      # This deploy has never carried --delete, so the web root has accumulated
      # every file ever removed or renamed on main (see
      # OCS-PROD-ORPHAN-ASSETS-ISSUE.md — ~34 stale URLs at the time of writing).
      # The web root has NEVER been diffed against the repo, so nobody knows what
      # else is up there: hand-uploaded files, control-panel artifacts, stats
      # directories, a legacy .htaccess.
      #
      # This step exists to produce that list and nothing else. It writes no
      # files. Read its output before anyone adds --delete to the live rsync
      # below — an unreviewed --delete is an irreversible production deletion.
      #
      # The exclude list MUST stay byte-identical to the live rsync's, or this
      # audit is describing a different operation than the one that will run.
      - name: rsync would-delete audit (dry run)
        env:
          DH_SSH_USER: ${{ secrets.DH_SSH_USER }}
          DH_SSH_HOST: ${{ secrets.DH_SSH_HOST }}
          DH_WEB_ROOT: ${{ secrets.DH_WEB_ROOT }}
        run: |
          set -euo pipefail
          echo "=== WOULD-DELETE AUDIT — dry run, nothing is written ==="
          echo "Every path listed below exists on the host but NOT in this repo."
          echo ""
          rsync -avz --omit-dir-times --dry-run --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.well-known/acme-challenge/' \
            --exclude='.dh-diag' \
            --exclude='CLAUDE.md' \
            --exclude='.DS_Store' \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o ConnectTimeout=30" \
            ./ "${DH_SSH_USER}@${DH_SSH_HOST}:${DH_WEB_ROOT}/" \
            | sed -n '/^deleting /p' | sort | tee /tmp/would-delete.txt
          echo ""
          echo "=== $(wc -l < /tmp/would-delete.txt) path(s) would be deleted ==="

      # ── 5. rsync live deploy (skipped on dry_run) ──────────────────────────
      # --delete enabled 2026-07-18 with Tim's approval under standing order 7,
      # after he read the would-delete audit from run 29650366247: 36 paths, all
      # classified. 34 were the stale renames/removals this work set out to clear
      # (30 demo-* pages, campaign.html, review.html, papers/mth-2026.pdf, and the
      # empty-basename tools/.html artifact), every renamed one already covered by
      # a 301 in .htaccess. favicon.gif was released (zero repo references;
      # browsers auto-request favicon.ico, which is tracked). .dh-diag is excluded
      # above rather than deleted — unknown provenance, nothing written by this
      # workflow, and keeping it costs nothing.
      #
      # Keep the exclude list byte-identical to the would-delete audit's, or the
      # audit stops describing the operation that actually runs.
      - name: rsync live deploy
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          DH_SSH_USER: ${{ secrets.DH_SSH_USER }}
          DH_SSH_HOST: ${{ secrets.DH_SSH_HOST }}
          DH_WEB_ROOT: ${{ secrets.DH_WEB_ROOT }}
        run: |
          set -euo pipefail
          echo "=== LIVE DEPLOY ==="
          rsync -avz --omit-dir-times --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.well-known/acme-challenge/' \
            --exclude='.dh-diag' \
            --exclude='CLAUDE.md' \
            --exclude='.DS_Store' \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o ConnectTimeout=30" \
            ./ "${DH_SSH_USER}@${DH_SSH_HOST}:${DH_WEB_ROOT}/"

      # ── 5b. Purge Cloudflare cache (skipped on dry_run) ───────────────────
      # Vendored from AINumbers/repo/.github/workflows/deploy-to-dreamhost.yml.
      #
      # omegacentauri.me is Cloudflare-fronted (confirmed 2026-07-18: responses
      # carry Server: cloudflare + CF-RAY). Without a purge the edge serves stale
      # content past a deploy, which is not just cosmetic — when the .htaccess
      # rename-301s went live, cached paths kept returning 200 with the old page
      # while uncached ones correctly returned 301. Verification against a warm
      # cache reports the wrong answer.
      #
      # Requires two repo secrets (GitHub → Settings → Secrets → Actions):
      #   CF_ZONE_ID    — omegacentauri.me zone ID (CF dashboard → Overview → API)
      #   CF_API_TOKEN  — scoped token, permission: Zone → Cache Purge → Purge
      # NEITHER IS SET on this repo as of 2026-07-18, so this step currently logs
      # a skip notice and exits 0. It never blocks an otherwise-good deploy.
      # purge_everything is used because prefix/tag purge is Enterprise-only.
      - name: Purge Cloudflare cache
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CF_ZONE_ID:-}" ] || [ -z "${CF_API_TOKEN:-}" ]; then
            echo "CF_ZONE_ID / CF_API_TOKEN not set — skipping Cloudflare purge."
            echo "Deployed content will go live as edge TTLs expire."
            exit 0
          fi
          RESP=$(curl -s -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          echo "$RESP"
          if echo "$RESP" | grep -q '"success":true'; then
            echo "Cloudflare cache purged — fresh content live."
          else
            echo "::error::Cloudflare purge failed (see response above). Files deployed OK; cache clears on TTL."
            exit 1
          fi

      # ── 6. Smoke test (skipped on dry_run) ────────────────────────────────
      # Accepts 200, 301, or 302 — DreamHost typically issues an HTTP→HTTPS
      # redirect (301/302) before the final 200, so we do NOT follow redirects.
      - name: Smoke test (HTTP 200/301/302 check)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          DH_SITE_URL: ${{ secrets.DH_SITE_URL }}
        run: |
          set -euo pipefail
          echo "Checking ${DH_SITE_URL}…"
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" \
                   --max-time 15 --retry 3 --retry-delay 5 \
                   "${DH_SITE_URL}")
          if [ "$STATUS" -ne 200 ] && [ "$STATUS" -ne 301 ] && [ "$STATUS" -ne 302 ]; then
            echo "::error::Smoke test failed — ${DH_SITE_URL} returned HTTP ${STATUS}"
            exit 1
          fi
          echo "Smoke test passed (HTTP ${STATUS})."

      # ── 7. Deploy summary (always runs) ───────────────────────────────────
      - name: Deploy summary
        if: always()
        run: |
          set -euo pipefail
          DRY="${{ github.event.inputs.dry_run }}"
          DRY="${DRY:-false}"
          PAGE_COUNT=$(find . -name "*.html" ! -path './.git/*' ! -path './.github/*' | wc -l)
          {
            echo "## Deploy summary"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Pages deployed | $PAGE_COUNT |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Triggered by | ${{ github.actor }} |"
            echo "| Dry run | \`$DRY\` |"
            if [ "$DRY" != "true" ]; then
              echo "| Site | ${{ secrets.DH_SITE_URL }} |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ───────────────────────────────────────────────────────────────────────────
  # Job 3 – Sync manifest to MCP worker repo
  #
  # After every live DreamHost deploy, copies tools/data/tools-manifest.json
  # to PostOakLabs/ocs-mcp-worker data/tools-manifest.json, commits if the
  # file changed, and pushes. The push triggers the Cloudflare GitHub App
  # to auto-deploy the updated worker — no manual generate.mjs run needed.
  #
  # Skipped on dry runs (no live rsync happened, manifest may not reflect HEAD).
  #
  # Required secret (Settings → Secrets → Actions in PostOakLabs/OCS):
  #   GH_DISPATCH_TOKEN — GitHub fine-grained PAT, Contents: write,
  #                       scoped to PostOakLabs/ocs-mcp-worker only.
  # ───────────────────────────────────────────────────────────────────────────
  sync-worker:
    name: Sync MCP worker manifest
    runs-on: ubuntu-latest
    needs: deploy
    if: ${{ github.event.inputs.dry_run != 'true' }}

    steps:
      - name: Checkout site repo (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Clone worker repo and sync manifest
        env:
          GH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail

          git clone \
            "https://x-access-token:${GH_TOKEN}@github.com/PostOakLabs/ocs-mcp-worker.git" \
            /tmp/ocs-mcp-worker

          cp tools/data/tools-manifest.json /tmp/ocs-mcp-worker/data/tools-manifest.json

          cd /tmp/ocs-mcp-worker
          git config user.email "ci@omegacentauri.me"
          git config user.name "OCS Deploy Bot"
          git add data/tools-manifest.json

          if git diff --quiet --cached; then
            echo "Manifest unchanged — no commit. Cloudflare deploy not triggered."
          else
            UPDATED=$(date -u +%Y-%m-%d)
            git commit -m "auto: sync manifest from site deploy ${UPDATED} (${{ github.sha }})"
            git push
            echo "Manifest synced and pushed — Cloudflare deploy triggered."
          fi

      - name: Sync summary
        if: always()
        run: |
          {
            echo "## MCP worker sync"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Worker repo | \`PostOakLabs/ocs-mcp-worker\` |"
            echo "| Branch | \`master\` |"
            echo "| Source manifest | \`tools/data/tools-manifest.json\` |"
            echo "| Cloudflare deploy | auto-triggered on push (GitHub App) |"
          } >> "$GITHUB_STEP_SUMMARY"
