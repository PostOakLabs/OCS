# External-link check — MANUAL ONLY (no schedule).
# The per-deploy `Broken-link gate` in deploy.yml covers INTERNAL/on-disk links.
# This complements it by checking EXTERNAL links (DOIs, arXiv, citations) with
# lychee, which needs an unrestricted CI network (the local sandbox is host-
# allowlisted and can't do this). Run on demand from the Actions tab.
#
# To enable a recurring run later, uncomment the `schedule` block below.
name: External links (manual)

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 7 * * 1"   # 07:00 UTC every Monday — uncomment to enable weekly

permissions:
  contents: read

jobs:
  external-links:
    name: lychee external link check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # Accept 2xx + bot-block/rate-limit codes (many journals/Scholar return
          # 403/429 to crawlers while being perfectly live). Exclude hosts known to
          # block automated checks. Checks all HTML, internal + external.
          args: >-
            --no-progress
            --max-concurrency 8
            --accept 200..=299,403,429
            --exclude-mail
            --exclude 'fonts\.(googleapis|gstatic)\.com'
            --exclude 'scholar\.google\.com'
            './**/*.html'
          fail: true
          jobSummary: true
