  <div class="quick-presets">

<script src="../data/measurements.js"></script>
<script>
// All values in Joules (energy base) or Watts (power base)
const ENERGY_UNITS = {
  J:    {to_J: 1,            label:'Joule'},
  kJ:   {to_J: 1e3,          label:'Kilojoule'},
  MJ:   {to_J: 1e6,          label:'Megajoule'},
  GJ:   {to_J: 1e9,          label:'Gigajoule'},
  TJ:   {to_J: 1e12,         label:'Terajoule'},
  PJ:   {to_J: 1e15,         label:'Petajoule'},
  EJ:   {to_J: 1e18,         label:'Exajoule'},
  kWh:  {to_J: 3.6e6,        label:'Kilowatt-hour'},
  MWh:  {to_J: 3.6e9,        label:'Megawatt-hour'},
  GWh:  {to_J: 3.6e12,       label:'Gigawatt-hour'},
  TWh:  {to_J: 3.6e15,       label:'Terawatt-hour'},
  erg:  {to_J: 1e-7,         label:'Erg'},
  eV:   {to_J: 1.602e-19,    label:'Electronvolt'},
  keV:  {to_J: 1.602e-16,    label:'Kiloelectronvolt'},
  MeV:  {to_J: 1.602e-13,    label:'Megaelectronvolt'},
  GeV:  {to_J: 1.602e-10,    label:'Gigaelectronvolt'},
  TeV:  {to_J: 1.602e-7,     label:'Teraelectronvolt'},
  cal:  {to_J: 4.184,        label:'Calorie'},
  kcal: {to_J: 4184,         label:'Kilocalorie'},
  BTU:  {to_J: 1055.06,      label:'BTU'},
  tTNT:   {to_J: 4.184e9,   label:'Tonne TNT'},
  ktTNT:  {to_J: 4.184e12,  label:'Kilotonne TNT'},
  MtTNT:  {to_J: 4.184e15,  label:'Megatonne TNT'},
  GtTNT:  {to_J: 4.184e18,  label:'Gigatonne TNT'},
};
const POWER_UNITS = {
  W:       {to_W: 1,         label:'Watt'},
  kW:      {to_W: 1e3,       label:'Kilowatt'},
  MW:      {to_W: 1e6,       label:'Megawatt'},
  GW:      {to_W: 1e9,       label:'Gigawatt'},
  TW:      {to_W: 1e12,      label:'Terawatt'},
  PW:      {to_W: 1e15,      label:'Petawatt'},
  Lsun:    {to_W: 3.828e26,  label:'Solar luminosity (L☉)'},
  Learth:  {to_W: 1.74e17,   label:'Earth total insolation'},
  K1:      {to_W: 1.74e17,   label:'Kardashev K1'},
  K2:      {to_W: 3.86e26,   label:'Kardashev K2'},
};
const isPower = k => k in POWER_UNITS;
const isEnergy = k => k in ENERGY_UNITS;

function fmt(x){
  if(x===0) return '0';
  const a=Math.abs(x);
  if(a>=1e15 || a<1e-6) return x.toExponential(4);
  if(a>=1000) return x.toLocaleString(undefined,{maximumSignificantDigits:6});
  return x.toPrecision(5).replace(/\.?0+$/,'');
}

// Output rows: [unit_key, label, context_note, mode]
const E_ROWS = [
  {section:'SI Energy'},
  {k:'J',     ctx:'SI base unit'},
  {k:'kJ',    ctx:'Energy of lifting ~100 kg 1 metre'},
  {k:'MJ',    ctx:'Energy in ~0.28 kWh; ~250 kcal'},
  {k:'GJ',    ctx:'Energy in ~278 kWh'},
  {k:'TJ',    ctx:'~240 tonnes TNT equivalent'},
  {k:'PJ',    ctx:'1 EJ = 1000 PJ; ~238,000 tonnes oil'},
  {k:'EJ',    ctx:'World primary energy ≈ 580 EJ/yr (2023)'},
  {section:'Practical'},
  {k:'kWh',   ctx:'Household electricity: 10–30 kWh/day'},
  {k:'TWh',   ctx:'Electricity from a large nuclear plant ×year'},
  {k:'kcal',  ctx:'Food energy: ~2000 kcal/day adult'},
  {k:'BTU',   ctx:'British thermal unit: 1 BTU = 1055 J'},
  {section:'Nuclear / explosives'},
  {k:'tTNT',  ctx:'Conventional bomb reference'},
  {k:'MtTNT', ctx:'Tsar Bomba: ~50 MT; Hiroshima: ~15 kT'},
  {section:'Particle physics'},
  {k:'eV',    ctx:'Energy scale of chemical bonds (~few eV)'},
  {k:'MeV',   ctx:'Nuclear reactions; proton rest mass ~938 MeV'},
  {k:'GeV',   ctx:'LHC beam energy: ~6.5 TeV/beam'},
  {k:'TeV',   ctx:'LHC energy; cosmic rays reach ZeV (10²¹ eV)'},
  {section:'Cosmic'},
  {k:'erg',   ctx:'CGS energy unit: 1 erg = 10⁻⁷ J'},
];
const P_ROWS = [
  {section:'SI Power'},
  {k:'W',    ctx:'1 joule/second; LED ~8 W'},
  {k:'kW',   ctx:'Household peak draw ~5–15 kW'},
  {k:'MW',   ctx:'Small power plant; large wind turbine'},
  {k:'GW',   ctx:'Nuclear plant; city power demand'},
  {k:'TW',   ctx:'World power 2025: ~18.4 TW'},
  {k:'PW',   ctx:'10¹⁵ W; total sunlight reaching Earth ×58'},
  {section:'Astronomical'},
  {k:'Lsun',   ctx:'Solar luminosity: 3.828 × 10²⁶ W'},
  {k:'Learth', ctx:'Total solar power intercepted by Earth'},
  {section:'Kardashev levels'},
  {k:'K1', ctx:'Planetary civilisation: harnesses all solar input to planet'},
  {k:'K2', ctx:'Stellar civilisation: entire solar output (Dyson sphere)'},
];

function getBaseValue(val, unitKey){
  if(isEnergy(unitKey)) return val * ENERGY_UNITS[unitKey].to_J;
  if(isPower(unitKey))  return val * POWER_UNITS[unitKey].to_W;
  return 0;
}
function renderRows(baseVal, unitKey){
  const isP = isPower(unitKey);
  const rows = isP ? P_ROWS : E_ROWS;
  const units = isP ? POWER_UNITS : ENERGY_UNITS;
  const key   = isP ? 'to_W' : 'to_J';
  let html='';
  for(const r of rows){
    if(r.section){
      html+=`<tr class="section-header"><td colspan="3">${r.section}</td></tr>`;
      continue;
    }
    const converted = baseVal / units[r.k][key];
    const bold = r.k===unitKey ? 'style="color:var(--amber-glow)"' : '';
    html+=`<tr><td class="otd-name">${units[r.k].label}</td><td class="otd-val" ${bold}>${fmt(converted)}</td><td class="otd-desc">${r.ctx}</td></tr>`;
  }
  return html;
}

function calculate(){
  const val = parseFloat(document.getElementById('num-in').value)||0;
  const unitKey = document.getElementById('unit-in').value;
  const baseVal = getBaseValue(val, unitKey);
  document.getElementById('out-body').innerHTML = renderRows(baseVal, unitKey);
  saveHash(val, unitKey);
}
function setPreset(v, u){
  document.getElementById('num-in').value = v;
  document.getElementById('unit-in').value = u;
  calculate();
}
function saveHash(v,u){ history.replaceState(null,'','#v='+v+'&u='+encodeURIComponent(u)); }
function loadHash(){
  const p=new URLSearchParams(location.hash.slice(1));
  if(p.has('v')&&p.has('u')){ document.getElementById('num-in').value=p.get('v'); document.getElementById('unit-in').value=p.get('u'); }
}

window.OCS_APPLY_PREFILL = function(obj){
  if(obj.value !== undefined) document.getElementById('num-in').value=obj.value;
  if(obj.unit  !== undefined) document.getElementById('unit-in').value=obj.unit;
  calculate();
};
window.OCS_RUN = calculate;

loadHash();
calculate();
</script>
<script src="../data/prefill.js"></script>
