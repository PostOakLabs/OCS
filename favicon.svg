<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>The Omega Centauri Society</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%"  stop-color="#1a1040"/>
      <stop offset="100%" stop-color="#03020a"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#ffe8a0"/>
      <stop offset="60%" stop-color="#f0a020" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#7055d4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded dark square background -->
  <rect width="64" height="64" rx="12" fill="url(#bg)"/>

  <!-- ISCO ring -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#4de8c0" stroke-opacity="0.45" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="17" fill="none" stroke="#a080f0" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="2 3"/>

  <!-- Cluster glow + core -->
  <circle cx="32" cy="32" r="13" fill="url(#core)"/>

  <!-- A few cluster stars -->
  <g fill="#fff5d0">
    <circle cx="32" cy="32" r="2"/>
    <circle cx="29" cy="30" r="1"/>
    <circle cx="35" cy="34" r="1"/>
    <circle cx="33" cy="28" r="0.8"/>
    <circle cx="28" cy="35" r="0.8"/>
    <circle cx="37" cy="30" r="0.7"/>
    <circle cx="26" cy="31" r="0.7"/>
  </g>
</svg>
